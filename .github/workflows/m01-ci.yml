name: NERVA M01-M03 policy, simulation and safety validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: nerva
          POSTGRES_USER: nerva
          POSTGRES_PASSWORD: nerva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerva -d nerva"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nerva:nerva@127.0.0.1:5432/nerva
      NERVA_ENVIRONMENT: LOCAL
      NERVA_EXECUTION_ENABLED: 'false'
      NERVA_KILL_SWITCH_ENABLED: 'true'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Verify exact dependency tree
        run: npm ls --all
      - name: Validate locked governance inputs
        run: npm run context:validate
      - name: Preserve Source Pack and GEF state
        run: |
          npm run sourcepack:validate
          npm run gef:package:verify
          npm run gef:verify
      - name: Validate workspace graph and M03 safety boundaries
        run: |
          npm run workspace:validate
          npm run deps:boundary
          npm run m03:safety:verify
      - name: Format, lint, and strict types
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Unit, replay, adversarial and recovery tests
        run: npm test -- --reporter=dot
      - name: Deterministic risk p95 benchmark
        run: npm run risk:benchmark
      - name: Deterministic M03 policy and decision-to-plan benchmark
        run: npm run m03:benchmark
      - name: Build web and worker
        run: npm run build
      - name: Scan client assets
        run: npm run security:client-bundle
      - name: Dependency audit at HIGH
        run: npm run security:audit
      - name: Check and apply migrations to clean PostgreSQL
        run: |
          npm run db:check
          npm run db:smoke
      - name: Upgrade accepted M02 schema through the M03 migration
        run: npm run db:upgrade-smoke
        env:
          NERVA_ALLOW_DISPOSABLE_DATABASE: 'true'
      - name: Safe-mode boot smoke
        run: npm run smoke:boot

  windows-bounded:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Bounded domain, contracts, config, policy, execution, Perpl and risk tests
        run: npm test -- --reporter=dot packages/domain/src/safety.test.ts packages/contracts/src/policy.test.ts packages/contracts/src/observation.test.ts packages/config/src/environment.test.ts packages/perpl/src/client.test.ts packages/perpl/src/normalizer.test.ts packages/risk/src/engine.test.ts packages/policy/src/index.test.ts packages/execution/src/index.test.ts
      - name: Strict typecheck
        run: npm run typecheck
