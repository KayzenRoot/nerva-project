name: M06 Prettier Probe

on:
  push:
    branches:
      - tmp/m06-postgres-fallback-prettier

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Format and print target
        run: |
          ./node_modules/.bin/prettier packages/config/src/environment.test.ts --write
          echo '===BEGIN_FORMATTED_FILE==='
          cat packages/config/src/environment.test.ts
          echo '===END_FORMATTED_FILE==='
