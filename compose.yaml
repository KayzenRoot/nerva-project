services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nerva}
      POSTGRES_USER: ${POSTGRES_USER:-nerva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerva}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nerva_m01_db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NERVA_ENVIRONMENT: LOCAL
      NERVA_EXECUTION_ENABLED: 'false'
      NERVA_KILL_SWITCH_ENABLED: 'true'
      NERVA_LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-nerva}:${POSTGRES_PASSWORD:-nerva}@db:5432/${POSTGRES_DB:-nerva}
    depends_on:
      db:
        condition: service_healthy

volumes:
  nerva_m01_db:
